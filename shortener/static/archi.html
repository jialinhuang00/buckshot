<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>URL Shortener Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one screen, no page scroll. A bar of controls, the drawing, one line of legend.
   The current step floats in a band kept free under the drawing. The pink dot is the only loud colour. */
:root {
  --bg: #eceff3;
  --panel: #f8fafc;
  --ink: #17202b;
  --muted: #5a6573;
  --rule: #c3cad3;
  --grid: rgba(23, 32, 43, 0.07);
  --stream: #6a3fd0;
  --tick: #a8500c;
  --packet: #d6246e;
  --j-str: #00758f;
  --j-word: #c2302a;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --body: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #171e28; --ink: #e5eaf0; --muted: #94a1af; --rule: #2d3745;
    --grid: rgba(229, 234, 240, 0.06);
    --stream: #ab8fff; --tick: #f0a35a; --packet: #ff5f9c; --j-str: #55d2ec; --j-word: #ff7168;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #171e28; --ink: #e5eaf0; --muted: #94a1af; --rule: #2d3745;
  --grid: rgba(229, 234, 240, 0.06);
  --stream: #ab8fff; --tick: #f0a35a; --packet: #ff5f9c; --j-str: #55d2ec; --j-word: #ff7168;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
/* the Artifact skeleton ships this rule; a standalone page has to bring its own, or display:flex beats the hidden attribute */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; }
.sheet {
  height: 100%; box-sizing: border-box; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}

.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.left { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; }
.tabs, .ctl { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: 600 0.84rem var(--body); color: var(--ink); background: var(--panel);
  border: 1.5px solid var(--ink); padding: 7px 13px; cursor: pointer; border-radius: 0;
}
button:hover { background: var(--bg); }
button:focus-visible { outline: 2px solid var(--packet); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs button small { font: 400 0.72rem var(--mono); opacity: 0.75; margin-left: 6px; }
.ctl button { display: inline-flex; align-items: center; padding: 8px 10px; }
#af-vars::before { content: attr(data-label); align-self: center; font-size: 0.8rem; color: var(--muted); margin-right: 2px; }
#af-vars button { padding: 5px 10px; font-size: 0.8rem; border-style: dashed; }
#af-vars button[aria-pressed="true"] { border-style: solid; }

figure { position: relative; margin: 0; display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
/* The bottom padding is a fixed band for the snackbar. It is in px, not in drawing units,
   so the snackbar never covers a node however short the window is. */
.frame {
  flex: 1; min-height: 0; overflow-x: auto; border: 1.5px solid var(--ink);
  box-sizing: border-box; padding-bottom: 104px;
  background: radial-gradient(circle, var(--grid) 1px, transparent 1px) 0 0 / 16px 16px, var(--panel);
}
.frame svg { display: block; width: 100%; height: 100%; }
@media (max-width: 700px) { .frame svg { min-width: 860px; } }
figcaption {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  width: max-content; max-width: min(760px, calc(100% - 28px)); box-sizing: border-box;
  background: var(--ink); color: var(--bg); box-shadow: 4px 4px 0 var(--packet);
  padding: 10px 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline;
}
figcaption .n { font: 700 1rem var(--display); font-variant-numeric: tabular-nums; }
figcaption .t { font-size: 0.95rem; line-height: 1.5; min-width: 0; }
figcaption .src { grid-column: 2; font: 400 0.72rem var(--mono); opacity: 0.7; overflow-wrap: anywhere; }
code { font: 0.9em var(--mono); }

/* nodes */
.node .box { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.node .ttl { font: 700 14px var(--display); fill: var(--ink); }
.node .sub, .node .route { font: 400 10.5px var(--mono); fill: var(--muted); }
.node .ico { stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.slot { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.slot.on { stroke: var(--packet); stroke-width: 2; }
.slotT { font: 400 10.5px var(--mono); fill: var(--ink); }
.node, .edge { transition: opacity 0.25s; }
.dim { opacity: 0.28; }
.node.on .box { stroke: var(--packet); stroke-width: 2.5; }

/* edges. Order matters: .on comes after the kinds, .hit comes last. */
.edge path { fill: none; stroke-width: 1.8; }
.edge.call path { stroke: var(--ink); }
.edge.call polygon { fill: var(--ink); }
.edge.stream path { stroke: var(--stream); stroke-dasharray: 7 5; animation: march 0.7s linear infinite; }
.edge.stream polygon { fill: var(--stream); }
.edge.tick path { stroke: var(--tick); stroke-dasharray: 6 6; animation: burst 5s linear infinite; }
.edge.tick polygon { fill: var(--tick); }
.edge.on path { stroke: var(--packet); stroke-width: 5; }
.edge.on polygon { fill: var(--packet); }
.edge text { font: 400 11px var(--mono); fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.edge.stream text { fill: var(--stream); }
.edge.tick text { fill: var(--tick); }
.edge.on text { fill: var(--packet); font-weight: 600; }
@keyframes march { to { stroke-dashoffset: -12; } }
/* a job on a timer: the dashes move for a fifth of the period, then stand still */
@keyframes burst { 0% { stroke-dashoffset: 0; } 20%, 100% { stroke-dashoffset: -48; } }
/* wide invisible stroke so a thin line is easy to hover */
.edge path.hit { stroke: transparent; stroke-width: 18; stroke-dasharray: none; animation: none; pointer-events: stroke; }
.edge.on, #af-packet, #af-halo { cursor: help; }
#af-packet { fill: var(--packet); stroke: var(--panel); stroke-width: 2.5; }
#af-halo { fill: transparent; stroke: var(--packet); stroke-width: 1.5; opacity: 0.55; }

#af-pop {
  position: absolute; z-index: 5; pointer-events: none; box-sizing: border-box;
  max-width: min(460px, calc(100% - 16px)); padding: 10px 12px;
  background: var(--panel); color: var(--ink); border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 var(--rule);
}
#af-pop .hd { font: 400 0.7rem var(--mono); color: var(--muted); margin-bottom: 6px; }
#af-pop pre { margin: 0; font: 400 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
#af-pop .jk { color: var(--stream); }
#af-pop .js { color: var(--j-str); }
#af-pop .jn { color: var(--tick); }
#af-pop .jw { color: var(--j-word); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { flex: none; }
.legend .dot { fill: var(--packet); }

@media (prefers-reduced-motion: reduce) {
  .edge.stream path, .edge.tick path { animation: none; }
  .node, .edge { transition: none; }
}
</style>

<div class="sheet" id="app"></div>

<script>
/* hiroki-archi-flow renderer. Framework-free: ArchiFlow.mount(root, data, icons).
   It knows nothing about any one repo. Everything repo-specific is in the data file.
   The meaning of each line kind and each node outline is fixed here, so the legend cannot drift from the drawing. */
(function () {
  // Role glyphs, drawn on a 34 grid with strokes only. Products use a real logo from icons/ instead.
  const ROLE = {
    browser: '<rect x="5" y="8" width="24" height="18"/><path d="M5 13h24"/>',
    user: '<circle cx="17" cy="12" r="5"/><path d="M7 28c0-6 4.5-9 10-9s10 3 10 9"/>',
    phone: '<rect x="10" y="5" width="14" height="24" rx="2"/><path d="M15 25h4"/>',
    clock: '<circle cx="17" cy="17" r="10"/><path d="M17 11v6l4.5 2.5"/>',
    batch: '<path d="M7 9h20M7 14h20M7 19h20"/><path d="M17 22v6M13.5 25l3.5 3.5 3.5-3.5"/>',
    file: '<path d="M10 5h10l5 5v19H10z"/><path d="M20 5v5h5"/><path d="M13.5 17h8M13.5 22h8"/>',
    globe: '<circle cx="17" cy="17" r="11"/><ellipse cx="17" cy="17" rx="4.5" ry="11"/><path d="M6 17h22"/>',
    terminal: '<rect x="5" y="7" width="24" height="20"/><path d="M10 13l4 4-4 4M17 21h6"/>',
    chip: '<rect x="9" y="9" width="16" height="16"/><path d="M13 5v4M17 5v4M21 5v4M13 25v4M17 25v4M21 25v4M5 13h4M5 17h4M5 21h4M25 13h4M25 17h4M25 21h4"/>',
    gear: '<circle cx="17" cy="17" r="4"/><path d="M17 6v4M17 24v4M6 17h4M24 17h4M9.2 9.2l2.8 2.8M22 22l2.8 2.8M9.2 24.8l2.8-2.8M22 12l2.8-2.8"/>',
  }

  const UI = {
    en: {
      auto: 'Auto-play', prev: 'Previous step (left arrow key)', next: 'Next step (right arrow key)', outcome: 'This time',
      sample: 'Sample data. Field names and commands come from the code. The values are made up.',
      now: 'The current step. Hover it, or the thick line, to see sample data.',
      line: {
        call: 'Solid: one question, one answer. The arrow points at the side being asked.',
        stream: 'Moving dashes: data keeps flowing on its own. The arrow is where the data goes.',
        tick: 'Dashes that move, then wait: a job on a timer.',
      },
      shape: { pill: 'person or browser', rect: 'service that takes requests', cyl: 'data store', pipe: 'queue', hex: 'background worker' },
    },
    zh: {
      auto: '自動播放', prev: '上一步（鍵盤左鍵）', next: '下一步（鍵盤右鍵）', outcome: '這次',
      sample: '示範資料。欄位名跟指令來自 code，值是編的',
      now: '現在這一步。滑到它或變粗的那條線上會顯示示範資料',
      line: {
        call: '實線是一問一答，箭頭指向被問的那一方',
        stream: '一直在走的虛線，是資料自己持續流過去',
        tick: '走一下停一下的虛線，是定時跑的工作',
      },
      shape: { pill: '人或瀏覽器', rect: '接 request 的服務', cyl: '存資料的', pipe: 'queue', hex: '背景 worker' },
    },
  }

  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
  const dOf = (pts) => 'M' + pts.map((p) => p.join(' ')).join(' L')
  function head(pts) {
    const [x2, y2] = pts[pts.length - 1], [x1, y1] = pts[pts.length - 2]
    const a = Math.atan2(y2 - y1, x2 - x1), c = Math.cos(a), s = Math.sin(a)
    const bx = x2 - 10 * c, by = y2 - 10 * s
    return `${x2},${y2} ${bx - 4.5 * s},${by + 4.5 * c} ${bx + 4.5 * s},${by - 4.5 * c}`
  }

  // Every outline touches the four midpoints of its bounding box, so an edge anchored there meets the outline.
  const SHAPE = {
    rect: (n) => `<rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"/>`,
    pill: (n) => `<rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.h / 2}"/>`,
    hex: (n) => {
      const i = Math.min(14, n.h * 0.22)
      return `<polygon class="box" points="${n.x},${n.y + n.h / 2} ${n.x + i},${n.y} ${n.x + n.w - i},${n.y} ${n.x + n.w},${n.y + n.h / 2} ${n.x + n.w - i},${n.y + n.h} ${n.x + i},${n.y + n.h}"/>`
    },
    cyl: (n) => {
      const c = Math.min(7, n.h * 0.2)
      return `<path class="box" d="M${n.x} ${n.y + c}v${n.h - 2 * c}a${n.w / 2} ${c} 0 0 0 ${n.w} 0v${-(n.h - 2 * c)}"/>`
        + `<ellipse class="box" cx="${n.x + n.w / 2}" cy="${n.y + c}" rx="${n.w / 2}" ry="${c}"/>`
    },
    pipe: (n) => {
      const c = Math.min(8, n.h * 0.2)
      return `<path class="box" d="M${n.x + c} ${n.y}H${n.x + n.w - c}A${c} ${n.h / 2} 0 0 1 ${n.x + n.w - c} ${n.y + n.h}H${n.x + c}A${c} ${n.h / 2} 0 0 1 ${n.x + c} ${n.y}z"/>`
        + `<ellipse class="box" cx="${n.x + n.w - c}" cy="${n.y + n.h / 2}" rx="${c}" ry="${n.h / 2}"/>`
    },
  }

  const BTN = {
    auto: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3l8 5-8 5z" fill="currentColor"/></svg>',
    prev: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    next: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  }

  function mount(root, data, icons) {
    icons = icons || {}
    const NODES = data.nodes, EDGES = data.edges, JOURNEYS = data.journeys
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    // English first. z switches to Chinese and back; nothing on the page says so and the choice is not remembered.
    let lang = 'en', ji = 0, si = 0, vi = null, playing = !reduced, token = 0, pending = false
    const tx = (v) => (v == null ? '' : typeof v === 'string' ? v : v[lang] != null ? v[lang] : v.en)
    const [W, H] = data.viewBox

    root.innerHTML = `<div class="bar"><div class="left">`
      + `<div class="tabs" id="af-tabs" role="group"></div><div class="tabs" id="af-vars" role="group"></div></div>`
      + `<div class="ctl"><button id="af-auto" type="button">${BTN.auto}</button>`
      + `<button id="af-prev" type="button">${BTN.prev}</button><button id="af-next" type="button">${BTN.next}</button></div></div>`
      + `<figure><div class="frame"><svg id="af-svg" viewBox="0 0 ${W} ${H}" role="img"></svg></div>`
      + `<figcaption id="af-cap"><span class="n"></span><span class="t"></span><span class="src"></span></figcaption>`
      + `<div id="af-pop" hidden><div class="hd"></div><pre></pre></div></figure>`
      + `<div class="legend" id="af-legend"></div>`
    const $ = (id) => document.getElementById('af-' + id)
    const svg = $('svg'), tabs = $('tabs'), vars = $('vars'), cap = $('cap'), pop = $('pop'), fig = pop.parentElement

    // one colour token per node that names a hue: [light, dark]
    const hued = Object.keys(NODES).filter((id) => NODES[id].hue)
    const hueCss = (sel, i) => `${sel}{${hued.map((id) => `--n-${id}:${NODES[id].hue[i]}`).join(';')}}`
    const st = document.createElement('style')
    st.textContent = hueCss(':root', 0) + `@media (prefers-color-scheme: dark){${hueCss(':root:not([data-theme="light"])', 1)}}` + hueCss(':root[data-theme="dark"]', 1)
    document.head.appendChild(st)

    function glyph(name, hue, x, y, S) {
      const ic = icons[name]
      if (ic) return `<svg x="${x}" y="${y}" width="${S}" height="${S}" viewBox="${ic.vb}"${ic.mono ? ` fill="${hue}"` : ''}>${ic.body}</svg>`
      const r = ROLE[String(name).replace('role:', '')]
      return r ? `<g class="ico" transform="translate(${x} ${y}) scale(${S / 34})" fill="none" stroke="${hue}">${r}</g>` : ''
    }
    function nodeSvg(id, n) {
      const hue = n.hue ? `var(--n-${id})` : 'var(--muted)', kind = n.shape || 'rect'
      const dx = kind === 'rect' || kind === 'cyl' ? 12 : 22, dy = kind === 'cyl' ? 6 : 0
      const S = 44, ix = n.x + dx, iy = n.y + 14 + dy
      return `<g class="node" data-n="${id}">${SHAPE[kind](n)}${glyph(n.icon, hue, ix, iy, S)}`
        + `<text class="ttl" x="${ix + S + 8}" y="${iy + 19}">${esc(tx(n.t))}</text>`
        + `<text class="sub" x="${ix + S + 8}" y="${iy + 36}">${esc(tx(n.s))}</text>`
        + (n.routes || []).map((r, i) => `<text class="route" x="${n.x + 14}" y="${n.y + 96 + i * 17}">${esc(r)}</text>`).join('')
        + (n.slots || []).map((s) => `<rect class="slot" data-slot="${s.id}" x="${n.x + 10}" y="${s.y - 11}" width="${n.w - 20}" height="22"/>`
          + `<text class="slotT" x="${n.x + 18}" y="${s.y + 4}">${esc(s.t)}</text>`).join('')
        + `</g>`
    }
    function draw() {
      let h = ''
      for (const [id, e] of Object.entries(EDGES)) {
        h += `<g class="edge ${e.kind}" data-e="${id}"><path id="af-p-${id}" d="${dOf(e.pts)}"${e.every ? ` style="animation-duration:${e.every}s"` : ''}/>`
          + `<path class="hit" d="${dOf(e.pts)}"/><polygon points="${head(e.pts)}"/>`
          + `<text x="${e.lx}" y="${e.ly}" text-anchor="${e.anchor || 'middle'}">${esc(tx(e.lab))}</text></g>`
      }
      for (const [id, n] of Object.entries(NODES)) h += nodeSvg(id, n)
      svg.innerHTML = h + `<circle id="af-halo" r="12" cx="-40" cy="-40"/><circle id="af-packet" r="8" cx="-40" cy="-40"/>`
      svg.setAttribute('aria-label', tx(data.title))

      const u = UI[lang]
      $('auto').title = u.auto; $('auto').setAttribute('aria-label', u.auto)
      $('prev').title = u.prev; $('prev').setAttribute('aria-label', u.prev)
      $('next').title = u.next; $('next').setAttribute('aria-label', u.next)
      vars.dataset.label = u.outcome
      pop.querySelector('.hd').textContent = u.sample
      tabs.innerHTML = JOURNEYS.map((j, i) => `<button type="button" id="af-tab-${j.id}" data-j="${i}">${esc(tx(j.name))}<small>${esc(j.route || '')}</small></button>`).join('')

      const kinds = [...new Set(Object.values(EDGES).map((e) => e.kind))], shapes = [...new Set(Object.values(NODES).map((n) => n.shape || 'rect'))]
      const line = (k) => `<span><svg width="46" height="12" viewBox="0 0 46 12" aria-hidden="true"><g class="edge ${k}"><path d="M1 6H36"/><polygon points="45,6 35,1.5 35,10.5"/></g></svg>${u.line[k]}</span>`
      const shp = (k) => `<span><svg width="30" height="16" viewBox="0 0 30 16" aria-hidden="true"><g class="node">${SHAPE[k]({ x: 1, y: 1, w: 28, h: 14 })}</g></svg>${u.shape[k]}</span>`
      $('legend').innerHTML = kinds.map(line).join('') + shapes.map(shp).join('')
        + `<span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" class="dot"/></svg>${u.now}</span>`
    }

    // the steps that exist for the outcome the reader picked
    const cur = () => { const j = JOURNEYS[ji]; return j.variants ? j.steps.filter((s) => !s.v || s.v.includes(vi)) : j.steps }
    function place(x, y) {
      for (const id of ['packet', 'halo']) { $(id).setAttribute('cx', x); $(id).setAttribute('cy', y) }
    }
    function paintJourney() {
      const j = JOURNEYS[ji]
      if (j.variants && !j.variants.some((v) => v.id === vi)) vi = j.start || j.variants[0].id
      const used = new Set(cur().flatMap((s) => s.e.map((x) => x[0])))
      const usedN = new Set([...used].flatMap((id) => [EDGES[id].a, EDGES[id].b]))
      svg.querySelectorAll('.edge').forEach((g) => g.classList.toggle('dim', !used.has(g.dataset.e)))
      svg.querySelectorAll('.node').forEach((g) => g.classList.toggle('dim', !usedN.has(g.dataset.n)))
      tabs.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === ji))
      vars.hidden = !j.variants
      vars.innerHTML = (j.variants || []).map((v) => `<button type="button" id="af-var-${v.id}" data-v="${v.id}" aria-pressed="${v.id === vi}">${esc(tx(v.name))}</button>`).join('')
    }
    function paintStep() {
      const steps = cur(), s = steps[si]
      const on = new Set(s.e.map((x) => x[0]))
      const onN = new Set([...on].flatMap((id) => [EDGES[id].a, EDGES[id].b]))
      svg.querySelectorAll('.edge').forEach((g) => g.classList.toggle('on', on.has(g.dataset.e)))
      svg.querySelectorAll('.node').forEach((g) => g.classList.toggle('on', onN.has(g.dataset.n)))
      svg.querySelectorAll('.slot').forEach((r) => r.classList.toggle('on', [...on].some((id) => EDGES[id].slot === r.dataset.slot)))
      cap.querySelector('.n').textContent = `${si + 1} / ${steps.length}`
      cap.querySelector('.t').innerHTML = tx(s.t)
      cap.querySelector('.src').textContent = s.src
    }

    // colour by token type: key, string, number, true/false/null
    function paintJSON(v) {
      return esc(JSON.stringify(v, null, 2)).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?/g, (m, str, colon, word) => {
